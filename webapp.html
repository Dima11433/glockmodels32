<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botshop Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #3a3a3a;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .product-card {
            background: #1f1f1f;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-card:hover {
            background: #262626;
            border-color: #667eea;
        }

        .product-info h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .product-info p {
            font-size: 12px;
            color: #888;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: #667eea;
            min-width: 60px;
            text-align: right;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 12px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #3a3a3a;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 32px 16px;
        }

        .error {
            background: #3a1f1f;
            border: 1px solid #8b4545;
            color: #ff9999;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .footer {
            background: #262626;
            padding: 12px 16px;
            text-align: center;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #3a3a3a;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .category-tab {
            background: #3a3a3a;
            border: 1px solid #4a4a4a;
            color: #ccc;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: flex;
            align-items: flex-end;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-content {
            background: #2a2a2a;
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 24px 16px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        .modal-close {
            font-size: 24px;
            cursor: pointer;
            position: absolute;
            top: 12px;
            right: 12px;
            background: #3a3a3a;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-top: 8px;
        }

        .modal-price {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 16px;
        }

        .modal-description {
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛍️ Botshop</h1>
    </div>

    <div class="container" id="app">
        <div class="category-tabs" id="categories">
            <button class="category-tab active" onclick="selectCategory(1)">Все товары</button>
            <button class="category-tab" onclick="selectCategory(2)">Популярные</button>
            <button class="category-tab" onclick="selectCategory(3)">Новинки</button>
            <button class="category-tab" onclick="selectCategory(4)">Скидки</button>
        </div>

        <div id="content">
            <div class="products-grid" id="products-grid-placeholder">
            <div class="loading">Загрузка товаров...</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>Powered by Botshop</p>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const TelegramWebApp = window.Telegram.WebApp;
        let currentUser = null;
        let products = [];
        let categories = [];
        let selectedCategory = null;
        let selectedProduct = null;

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            initializeWebApp();
        });

        async function initializeWebApp() {
            // Показываем заглушку загрузки
            document.getElementById('content').innerHTML = '<div class="loading">Загрузка товаров...</div>';

            // Загружаем товары с локального API
            await fetchProducts();

            // Инициализируем Telegram WebApp асинхронно
            if (typeof TelegramWebApp !== 'undefined') {
                TelegramWebApp.ready();
                TelegramWebApp.expand();
                TelegramWebApp.setHeaderColor('#667eea');
                TelegramWebApp.setBackgroundColor('#1a1a1a');

                // Получаем данные пользователя
                currentUser = TelegramWebApp.initData;
                console.log('User data:', currentUser);

                // Показываем кнопку Главного меню
                TelegramWebApp.MainButton.text = 'Назад в меню';
                TelegramWebApp.MainButton.show();
                TelegramWebApp.MainButton.onClick(() => {
                    TelegramWebApp.close();
                });
            }
        }

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
                const data = await res.json();

                categories = (data.categories && data.categories.length) ? data.categories : [{ id: 1, name: 'Все товары' }];
                products = data.products || [];
                selectedCategory = categories[0].id;

                renderCategories();
                renderProducts();
            } catch (err) {
                console.error('fetchProducts error', err);
                showError('Ошибка загрузки данных: ' + (err.message || err));
            }
        }

        function renderCategories() {
            const container = document.getElementById('categories');
            container.innerHTML = categories
                .map(cat => `
                    <button class="category-tab ${selectedCategory === cat.id ? 'active' : ''}"
                            onclick="selectCategory(${cat.id})">
                        ${cat.name}
                    </button>
                `)
                .join('');
        }

        function selectCategory(categoryId) {
            selectedCategory = categoryId;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const content = document.getElementById('content');
            const filtered = selectedCategory === 1 
                ? products 
                : products.filter(p => p.category_id === selectedCategory);

            if (!filtered || filtered.length === 0) {
                content.innerHTML = '<div class="loading">Товары не найдены</div>';
                return;
            }

            content.innerHTML = `
                <div class="section">
                    <div class="product-grid">
                        ${filtered.map(product => `
                            <div class="product-card" onclick="openProductModal(${product.id})">
                                <div class="product-thumb">${product.photos && product.photos.length ? `<img src="${photoUrl(product.photos[0])}" class="thumb">` : '<div class="no-thumb"></div>'}</div>
                                <div class="product-info">
                                    <h3>${product.name}</h3>
                                    <p>${product.description}</p>
                                </div>
                                <div class="product-price">$${(product.price / 100).toFixed(2)}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function photoUrl(v){
                        if(!v) return '';
                        // Если локальный файл в папке photos — используем относительную ссылку
                        if (v.startsWith('photos/') || v.startsWith('/photos/')) return v.startsWith('/') ? v : ('/' + v);
                        // Если это URL — возвращаем как есть
                        if (v.startsWith('http')) return v;
                        // Иначе пусто
                        return '';
                    }

                    function openProductModal(productId) {
                        selectedProduct = products.find(p => p.id === productId);
                        if (!selectedProduct) return;

                        const modalBody = document.getElementById('modal-body');
                        // Картинки
                        let photosHtml = '';
                        if (selectedProduct.photos && selectedProduct.photos.length) {
                            photosHtml = `<div class="carousel">${selectedProduct.photos.map((ph, i) => {
                                const src = photoUrl(ph);
                                return src ? `<img src="${src}" class="carousel-img" style="display:${i===0? 'block':'none'}" data-index="${i}"/>` : '';
                            }).join('')}</div>`;
                        } else {
                            photosHtml = '<div class="no-photo">Нет изображений</div>';
                        }

                        modalBody.innerHTML = `
                            ${photosHtml}
                            <div class="modal-title">${selectedProduct.name}</div>
                            <div class="modal-price">$${(selectedProduct.price / 100).toFixed(2)}</div>
                            <div class="modal-description">${selectedProduct.description}</div>
                            <div style="margin-top:12px; display:flex; gap:8px;">
                                <button class="btn" onclick="buyProduct()">💳 Купить</button>
                                <button class="btn btn-secondary" onclick="openReviewForm()">⭐ Оставить отзыв</button>
                            </div>
                        `;

                        // Обработчики карусели (нажатие по картинке переключает)
                        const imgs = modalBody.querySelectorAll('.carousel-img');
                        imgs.forEach(img => img.addEventListener('click', ()=>{
                            const idx = parseInt(img.dataset.index);
                            imgs.forEach((im,i)=> im.style.display = i===idx? 'block':'none');
                        }));

                        document.getElementById('modal').classList.add('active');
                    }

                    function openReviewForm(){
                        if(!selectedProduct) return;
                        const modalBody = document.getElementById('modal-body');
                        modalBody.innerHTML = `
                            <div class="modal-title">Оставить отзыв — ${selectedProduct.name}</div>
                            <div style="margin-bottom:8px;"><label>Оценка (1-5): <input id="rev-rating" type="number" min="1" max="5" value="5" style="width:60px"/></label></div>
                            <textarea id="rev-text" rows="5" style="width:100%" placeholder="Ваш отзыв..."></textarea>
                            <div style="margin-top:8px; display:flex; gap:8px;">
                                <button class="btn" onclick="submitReview()">Отправить</button>
                                <button class="btn btn-secondary" onclick="openProductModal(${selectedProduct.id})">Назад</button>
                            </div>
                        `;
                    }

                    function submitReview(){
                        const text = document.getElementById('rev-text').value.trim();
                        const rating = parseInt(document.getElementById('rev-rating').value) || 5;
                        if(!text){
                            alert('Напишите текст отзыва');
                            return;
                        }
                        const payload = { action: 'review', product_id: selectedProduct.id, rating, text };
                        try{
                            TelegramWebApp.sendData(JSON.stringify(payload));
                            TelegramWebApp.showAlert('Отзыв отправлен — спасибо!');
                            closeModal();
                        }catch(e){
                            alert('Ошибка отправки отзыва');
                        }
                    }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            selectedProduct = null;
        }

        function buyProduct() {
            if (!selectedProduct) return;

            // Отправляем сигнал в бот через WebApp
            TelegramWebApp.sendData(JSON.stringify({
                action: 'buy',
                product_id: selectedProduct.id,
                product_name: selectedProduct.name,
                price: selectedProduct.price
            }));

            // Показываем сообщение пользователю — бот обработает покупку и пришлёт результат
            TelegramWebApp.showAlert('Запрос на покупку отправлен. Проверьте сообщения в боте.');
            closeModal();
        }

        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="error">${message}</div>`;
        }
    </script>
</body>
</html>
